<!DOCTYPE html>
<html lang="ru" data-theme="swordfish">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackwire</title>
<script>
/* Тема и базовые настройки выставляются до загрузки стилей, чтобы окно не мигало чужими цветами. */
(function () {
  try {
    var root = document.documentElement;
    var theme = localStorage.getItem('bw_theme');
    if (theme) root.dataset.theme = theme;
    if (localStorage.getItem('bw_glass') === '0') root.classList.add('no-glass');
    var fs = parseInt(localStorage.getItem('bw_font'), 10);
    if (fs >= 10 && fs <= 24) root.style.setProperty('--font-size', fs + 'px');
    var app = new URLSearchParams(location.search).get('app') || 'desktop';
    root.dataset.app = app;
  } catch (e) { /* без localStorage — остаёмся на теме по умолчанию */ }
})();
</script>
