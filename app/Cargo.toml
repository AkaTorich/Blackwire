[package]
name = "blackwire"
version.workspace = true
edition.workspace = true
description = "Blackwire — игра про взлом с настоящими окнами (Tauri)"

[[bin]]
name = "Blackwire"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blackwire-core = { path = "../core" }
blackwire-lang = { path = "../lang" }
