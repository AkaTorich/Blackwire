[package]
name = "blackwire-core"
version.workspace = true
edition.workspace = true
description = "Blackwire — ядро игры: виртуальный компьютер, сеть, оболочка, язык Adder"

[lib]
name = "blackwire_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
blackwire-lang = { path = "../lang" }
