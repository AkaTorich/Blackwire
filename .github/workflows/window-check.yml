name: Native Linux window checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-on-failure: true
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file xvfb openbox dbus-x11 x11-utils
      - name: Build test game
        run: cargo build --locked -p blackwire
      - name: Native checks
        run: |
          xvfb-run -a dbus-run-session -- bash -c '
            openbox > /tmp/blackwire-wm.log 2>&1 &
            manager=$!
            sleep 2
            kill -0 "$manager"
            xprop -root _NET_SUPPORTING_WM_CHECK
            python tools/test_native_windows.py target/debug/Blackwire
            result=$?
            cat /tmp/blackwire-wm.log
            exit "$result"
          '
