# Push to main builds installers. Version tags also publish a release with the SDK ZIP.
name: Build

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            sdk_platform: windows
            target: ''
            bundles: nsis
            glob: target/release/bundle/nsis/*-setup.exe
          - platform: ubuntu-22.04
            sdk_platform: linux
            target: ''
            bundles: deb
            glob: target/release/bundle/deb/*.deb
          - platform: macos-latest
            sdk_platform: macos
            target: universal-apple-darwin
            bundles: dmg
            glob: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Linux libraries
        if: matrix.sdk_platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            file

      - name: SDK packaging cache tests
        run: python -B tools/test_package_sdk.py

      - name: Engine and Adder tests
        run: cargo test --locked -p blackwire-core -p blackwire-lang

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.4 --no-audit --no-fund

      - name: Build game, SDK and installer
        working-directory: app
        run: tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --bundles ${{ matrix.bundles }} --ci

      - name: Verify packaged SDK
        shell: bash
        run: |
          python tools/package_sdk.py verify
          checker="target/sdk/bin/${{ matrix.sdk_platform }}/plugin-check"
          if [ "${{ matrix.sdk_platform }}" = windows ]; then checker="$checker.exe"; fi
          "$checker" target/sdk/examples --command lab_create --command district_create --ticks 65

      - name: Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackwire-${{ matrix.sdk_platform }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

      - name: SDK checker artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-check-${{ matrix.sdk_platform }}
          path: target/sdk/bin/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify release version
        run: |
          python -c 'import json,os; v=json.load(open("app/tauri.conf.json"))["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v'

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: blackwire-*
          path: target/release-installers
          merge-multiple: true

      - name: Download SDK tools
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-check-*
          path: target/sdk-tools
          merge-multiple: true

      - name: Build and verify SDK ZIP
        run: |
          python tools/package_sdk.py archive --tools target/sdk-tools
          python tools/package_plugins.py

      - name: Publish installers and SDK
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          name: Blackwire ${{ github.ref_name }}
          body: |
            Blackwire with Adder Plugin SDK (API 1).
            Installers for Windows, Linux and macOS include the SDK.
            Blackwire-SDK-*.zip contains the manuals, CHM help, examples, schemas and checker tools for all three systems.
            Blackwire-Plugins-*.zip contains 100 standalone Adder plugins with individual START_HERE guides.
          fail_on_unmatched_files: true
          files: |
            target/release-installers/*
            target/release/Blackwire-SDK-*.zip
            target/release/Blackwire-Plugins-*.zip
