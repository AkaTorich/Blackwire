[package]
name = "blackwire-server"
version.workspace = true
edition.workspace = true
description = "Blackwire — онлайн-сервер общего мира (Linux, без окон)"

[[bin]]
name = "blackwire-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blackwire-core = { path = "../core" }
blackwire-lang = { path = "../lang" }
blackwire-wire = { path = "../wire" }
