<!DOCTYPE html><html lang="ru"><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1251"><title>Команды терминала Blackwire</title><style>body{font:15px Segoe UI,Arial,sans-serif;margin:26px;color:#172434;background:#fafbfc;line-height:1.55}h1{color:#173a57;font-size:27px}h2{color:#225875}pre{background:#e9eef3;padding:14px;white-space:pre-wrap;word-wrap:break-word;font:13px Consolas,monospace}code{font-family:Consolas,monospace}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #bcc8d2;padding:8px;text-align:left;vertical-align:top}th{background:#dce7ef}a{color:#125a87}.nav{font-size:13px;border-bottom:1px solid #ccd8e0;padding-bottom:10px}</style></head><body><div class="nav"><a href="index.html">Оглавление</a> | <a href="page047.html">Назад</a> | <a href="page049.html">Далее</a></div><h1>Команды терминала Blackwire</h1>
<p>Оболочка понимает конвейеры (<code>a | b</code>), перенаправления (<code>&gt;</code>, <code>&gt;&gt;</code>, <code>2&gt;</code>, <code>&lt;</code>), разделители (<code>;</code>, <code>&amp;&amp;</code>, <code>||</code>), переменные (<code>$ИМЯ</code>, <code>${ИМЯ}</code>), домашнюю папку (<code>~</code>) и подстановку <code>*</code>/<code>?</code> в именах файлов. У каждой команды есть <code>--help</code>.</p></body></html>
